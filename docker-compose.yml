name: rag-mvp

x-rag-environment: &rag-environment
  RAG_ENVIRONMENT: development
  RAG_GRPC_REFLECTION: "true"
  RAG_MYSQL_DSN: mysql+asyncmy://rag:rag@mysql:3306/rag
  RAG_ELASTICSEARCH_URL: https://elasticsearch:9200
  RAG_ELASTICSEARCH_USERNAME: rag_mvp
  RAG_ELASTICSEARCH_CA_CERT: /run/secrets/ca.pem
  RAG_NATS_URL: nats://nats:4222
  RAG_OBJECT_ROOT: /app/data/objects
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  RAG_PARSER_VERSION: "${RAG_PARSER_VERSION:-source-router-v10}"
  RAG_PDF_PARSER_MODE: "${RAG_PDF_PARSER_MODE:-auto}"
  RAG_PDF_NATIVE_TEXT_MIN_CHARS_PER_PAGE: "${RAG_PDF_NATIVE_TEXT_MIN_CHARS_PER_PAGE:-40}"
  RAG_PDF_OCR_LANGUAGE: "${RAG_PDF_OCR_LANGUAGE:-chi_sim+eng}"
  RAG_PDF_OCR_DPI: "${RAG_PDF_OCR_DPI:-200}"
  RAG_PDF_OCR_TIMEOUT_SECONDS: "${RAG_PDF_OCR_TIMEOUT_SECONDS:-60}"
  RAG_PDF_MAX_PAGES: "${RAG_PDF_MAX_PAGES:-1000}"
  RAG_PDF_HEADER_FOOTER_MARGIN_RATIO: "${RAG_PDF_HEADER_FOOTER_MARGIN_RATIO:-0.12}"
  RAG_PDF_REPEATED_MARGIN_MIN_PAGES: "${RAG_PDF_REPEATED_MARGIN_MIN_PAGES:-3}"
  RAG_EMBEDDING_BATCH_SIZE: "${RAG_EMBEDDING_BATCH_SIZE:-32}"
  RAG_EMBEDDING_MAX_CONCURRENCY: "${RAG_EMBEDDING_MAX_CONCURRENCY:-4}"
  RAG_EMBEDDING_MAX_RETRIES: "${RAG_EMBEDDING_MAX_RETRIES:-3}"

services:
  observability-retention:
    build: backend/go-api
    entrypoint: ["/usr/local/bin/observability-retention"]
    environment:
      OBS_TEMPO_BUDGET_BYTES: ${OBS_TEMPO_BUDGET_BYTES:-3221225472}
    volumes:
      - tempo-data:/var/tempo-data:ro
      - tempo-overrides:/var/tempo-overrides
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9470/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.132.0@sha256:e0f565815b2b8e78eb9fdbb80f6190c921ab323aaa8ccceab3255c6d4225f4af
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/observability/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=${OBS_PROMETHEUS_RETENTION_SIZE:-2GB}
    volumes:
      - ./deploy/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2@sha256:0ef775495967cd5d7a6b2e146b6ea695d624803c8db8349fb8ce4164f719f9b7
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
      - tempo-overrides:/var/tempo-overrides:ro
    depends_on:
      observability-retention:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: rag
      MYSQL_USER: rag
      MYSQL_PASSWORD: rag
      MYSQL_ROOT_PASSWORD: root-rag-dev
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  rag-security-materials:
    build:
      context: .
      dockerfile: Dockerfile.search-guard-bootstrap
    entrypoint: ["/bin/sh", "/app/docker/search-guard/entrypoints/prepare-materials.sh"]
    environment:
      RAG_ENVIRONMENT: development
    volumes:
      - search-guard-node-secrets:/node-secrets
      - search-guard-client-secrets:/client-secrets
    restart: "no"

  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.elasticsearch
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - search-guard-node-secrets:/usr/share/elasticsearch/config/search-guard:ro
    depends_on:
      rag-security-materials:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "password=$$(cat /usr/share/elasticsearch/config/search-guard/rag_mvp_password) && curl --fail --silent --show-error --cacert /usr/share/elasticsearch/config/search-guard/ca.pem --user rag_mvp:$$password https://localhost:9200/_searchguard/health | grep -q '\"status\"[[:space:]]*:[[:space:]]*\"UP\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  nats:
    image: nats:2.11.8-alpine
    command: ["-js", "-m", "8222", "--store_dir", "/data"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  rag-search-guard-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.search-guard-bootstrap
    entrypoint: ["/bin/sh", "/app/docker/search-guard/entrypoints/bootstrap.sh"]
    depends_on:
      elasticsearch:
        condition: service_started
    volumes:
      - search-guard-node-secrets:/node-secrets:ro
      - search-guard-client-secrets:/client-secrets:ro
    restart: "no"

  rag-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["rag-migrate", "upgrade", "head"]
    environment:
      RAG_ENVIRONMENT: development
      RAG_GRPC_REFLECTION: "false"
      RAG_MYSQL_DSN: mysql+asyncmy://rag:rag@mysql:3306/rag
      RAG_MIGRATIONS_ROOT: /app
    depends_on:
      mysql:
        condition: service_healthy
      rag-search-guard-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  rag-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["rag-server"]
    environment:
      <<: *rag-environment
      RAG_ELASTICSEARCH_PASSWORD_FILE: /run/secrets/rag_mvp_password
      RAG_MODEL_ENCRYPTION_KEY_FILE: /run/model-keys/encryption.key
      RAG_MAX_UPLOAD_BYTES: 67108864
      OTEL_SERVICE_NAME: rag-python-server
    ports:
      - "50051:50051"
    group_add: ["10001"]
    volumes:
      - product-model-keys:/run/model-keys:ro
      - object-data:/app/data/objects
      - search-guard-client-secrets:/run/secrets:ro
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rag-search-guard-bootstrap:
        condition: service_completed_successfully
      rag-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "/app/scripts/docker_healthcheck.py", "--grpc-only", "127.0.0.1:50051"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  rag-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["rag-worker"]
    environment:
      <<: *rag-environment
      RAG_ELASTICSEARCH_PASSWORD_FILE: /run/secrets/rag_mvp_password
      RAG_MODEL_ENCRYPTION_KEY_FILE: /run/model-keys/encryption.key
      RAG_ALLOW_LOCAL_MODELS: ${RAG_ALLOW_LOCAL_MODELS:-false}
      RAG_MAX_UPLOAD_BYTES: 67108864
      OTEL_SERVICE_NAME: rag-python-worker
    group_add: ["10001"]
    volumes:
      - product-model-keys:/run/model-keys:ro
      - object-data:/app/data/objects
      - search-guard-client-secrets:/run/secrets:ro
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rag-search-guard-bootstrap:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      rag-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rag-outbox:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["rag-outbox"]
    environment:
      <<: *rag-environment
      OTEL_SERVICE_NAME: rag-python-outbox
    volumes:
      - object-data:/app/data/objects
    depends_on:
      mysql:
        condition: service_healthy
      nats:
        condition: service_healthy
      rag-search-guard-bootstrap:
        condition: service_completed_successfully
      rag-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rag-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      <<: *rag-environment
      RAG_ELASTICSEARCH_PASSWORD_FILE: /run/secrets/rag_mvp_password
      EMBEDDING_MODEL_URL: ${EMBEDDING_MODEL_URL:-}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-}
      EMBEDDING_MODEL_API_KEY: ${EMBEDDING_MODEL_API_KEY:-}
      EMBEDDING_MODEL_DIMENSION: ${EMBEDDING_MODEL_DIMENSION:-}
      RAG_GRPC_TARGET: rag-server:50051
      RAG_MODEL_ENCRYPTION_KEY_FILE: /run/model-keys/encryption.key
    group_add: ["10001"]
    volumes:
      - product-model-keys:/run/model-keys:ro
      - ./tests:/app/tests:ro
      - ./tests/eval/log:/app/tests/eval/log:rw
      - ./proto:/app/proto:ro
      - ./scripts:/app/scripts:ro
      - object-data:/app/data/objects
      - search-guard-client-secrets:/run/secrets:ro
    depends_on:
      rag-server:
        condition: service_healthy
      rag-worker:
        condition: service_healthy
      rag-outbox:
        condition: service_healthy
      rag-search-guard-bootstrap:
        condition: service_completed_successfully

volumes:
  prometheus-data:
  tempo-data:
  tempo-overrides:
  mysql-data:
  elasticsearch-data:
  nats-data:
  object-data:
  search-guard-node-secrets:
  search-guard-client-secrets:
  product-model-keys:
    name: rag-product_product-keys
    external: true
