name: rag-mvp

x-rag-environment: &rag-environment
  RAG_ENVIRONMENT: development
  RAG_GRPC_REFLECTION: "true"
  RAG_MYSQL_DSN: mysql+asyncmy://rag:rag@mysql:3306/rag
  RAG_ELASTICSEARCH_URL: https://elasticsearch:9200
  RAG_ELASTICSEARCH_USERNAME: rag_mvp
  RAG_ELASTICSEARCH_CA_CERT: /run/secrets/ca.pem
  RAG_NATS_URL: nats://nats:4222
  RAG_OBJECT_ROOT: /app/data/objects

services:
  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: rag
      MYSQL_USER: rag
      MYSQL_PASSWORD: rag
      MYSQL_ROOT_PASSWORD: root-rag-dev
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  rag-security-materials:
    build:
      context: .
      dockerfile: Dockerfile.search-guard-bootstrap
    entrypoint: ["/bin/sh", "/app/docker/search-guard/entrypoints/prepare-materials.sh"]
    environment:
      RAG_ENVIRONMENT: development
    volumes:
      - search-guard-node-secrets:/node-secrets
      - search-guard-client-secrets:/client-secrets
    restart: "no"

  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.elasticsearch
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - search-guard-node-secrets:/usr/share/elasticsearch/config/search-guard:ro
      - search-guard-client-secrets:/usr/share/elasticsearch/config/client-secrets:ro
    depends_on:
      rag-security-materials:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "password=$$(cat /usr/share/elasticsearch/config/client-secrets/rag_mvp_password) && curl --fail --silent --show-error --cacert /usr/share/elasticsearch/config/client-secrets/ca.pem --user rag_mvp:$$password https://localhost:9200/_searchguard/health | grep -q '\"status\"[[:space:]]*:[[:space:]]*\"UP\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  nats:
    image: nats:2.11.8-alpine
    command: ["-js", "-m", "8222", "--store_dir", "/data"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  rag-search-guard-bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.search-guard-bootstrap
    entrypoint: ["/bin/sh", "/app/docker/search-guard/entrypoints/bootstrap.sh"]
    depends_on:
      elasticsearch:
        condition: service_started
    volumes:
      - search-guard-node-secrets:/node-secrets:ro
      - search-guard-client-secrets:/client-secrets:ro
    restart: "no"

  rag-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["rag-migrate", "upgrade", "head"]
    environment:
      RAG_ENVIRONMENT: development
      RAG_GRPC_REFLECTION: "false"
      RAG_MYSQL_DSN: mysql+asyncmy://rag:rag@mysql:3306/rag
      RAG_MIGRATIONS_ROOT: /app
    depends_on:
      mysql:
        condition: service_healthy
      rag-search-guard-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  rag-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["rag-server"]
    environment:
      <<: *rag-environment
      RAG_ELASTICSEARCH_PASSWORD_FILE: /run/secrets/rag_mvp_password
      EMBEDDING_MODEL_URL: ${EMBEDDING_MODEL_URL:?EMBEDDING_MODEL_URL is required}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:?EMBEDDING_MODEL_NAME is required}
      EMBEDDING_MODEL_API_KEY: ${EMBEDDING_MODEL_API_KEY:?EMBEDDING_MODEL_API_KEY is required}
      EMBEDDING_MODEL_DIMENSION: ${EMBEDDING_MODEL_DIMENSION:?EMBEDDING_MODEL_DIMENSION is required}
    ports:
      - "50051:50051"
    volumes:
      - object-data:/app/data/objects
      - search-guard-client-secrets:/run/secrets:ro
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rag-search-guard-bootstrap:
        condition: service_completed_successfully
      rag-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "/app/scripts/docker_healthcheck.py", "--grpc-only", "127.0.0.1:50051"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  rag-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["rag-worker"]
    environment:
      <<: *rag-environment
      RAG_ELASTICSEARCH_PASSWORD_FILE: /run/secrets/rag_mvp_password
      EMBEDDING_MODEL_URL: ${EMBEDDING_MODEL_URL:?EMBEDDING_MODEL_URL is required}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:?EMBEDDING_MODEL_NAME is required}
      EMBEDDING_MODEL_API_KEY: ${EMBEDDING_MODEL_API_KEY:?EMBEDDING_MODEL_API_KEY is required}
      EMBEDDING_MODEL_DIMENSION: ${EMBEDDING_MODEL_DIMENSION:?EMBEDDING_MODEL_DIMENSION is required}
    volumes:
      - object-data:/app/data/objects
      - search-guard-client-secrets:/run/secrets:ro
    depends_on:
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rag-search-guard-bootstrap:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      rag-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rag-outbox:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command: ["rag-outbox"]
    environment: *rag-environment
    volumes:
      - object-data:/app/data/objects
    depends_on:
      mysql:
        condition: service_healthy
      nats:
        condition: service_healthy
      rag-search-guard-bootstrap:
        condition: service_completed_successfully
      rag-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rag-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      <<: *rag-environment
      RAG_ELASTICSEARCH_PASSWORD_FILE: /run/secrets/rag_mvp_password
      EMBEDDING_MODEL_URL: ${EMBEDDING_MODEL_URL:?EMBEDDING_MODEL_URL is required}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:?EMBEDDING_MODEL_NAME is required}
      EMBEDDING_MODEL_API_KEY: ${EMBEDDING_MODEL_API_KEY:?EMBEDDING_MODEL_API_KEY is required}
      EMBEDDING_MODEL_DIMENSION: ${EMBEDDING_MODEL_DIMENSION:?EMBEDDING_MODEL_DIMENSION is required}
      RAG_GRPC_TARGET: rag-server:50051
    volumes:
      - ./tests:/app/tests:ro
      - ./tests/eval/log:/app/tests/eval/log:rw
      - ./proto:/app/proto:ro
      - ./scripts:/app/scripts:ro
      - object-data:/app/data/objects
      - search-guard-client-secrets:/run/secrets:ro
    depends_on:
      rag-server:
        condition: service_healthy
      rag-worker:
        condition: service_healthy
      rag-outbox:
        condition: service_healthy
      rag-search-guard-bootstrap:
        condition: service_completed_successfully

volumes:
  mysql-data:
  elasticsearch-data:
  nats-data:
  object-data:
  search-guard-node-secrets:
  search-guard-client-secrets:
