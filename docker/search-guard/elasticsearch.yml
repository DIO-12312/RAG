searchguard.ssl.transport.pemcert_filepath: search-guard/node.pem
searchguard.ssl.transport.pemkey_filepath: search-guard/node-key.pem
searchguard.ssl.transport.pemtrustedcas_filepath: search-guard/ca.pem
searchguard.ssl.transport.enforce_hostname_verification: true
searchguard.ssl.http.enabled: true
searchguard.ssl.http.pemcert_filepath: search-guard/node.pem
searchguard.ssl.http.pemkey_filepath: search-guard/node-key.pem
searchguard.ssl.http.pemtrustedcas_filepath: search-guard/ca.pem
xpack.security.enabled: false
# Keep the HTTPS endpoint reachable to containers on the private Compose network.
# This does not publish 9200 to the Docker host.
http.host: 0.0.0.0
searchguard.nodes_dn:
  # Search Guard extracts client principals with the RDN sequence reversed.
  - C=CN,L=Local,O=RAG,OU=RAG,CN=elasticsearch
searchguard.authcz.admin_dn:
  - C=CN,L=Local,O=RAG,OU=RAG,CN=sg_admin
