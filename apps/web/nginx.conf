server {
    listen 80;
    server_name _;

    # A 64 MiB source file gains multipart framing overhead in the browser.
    client_max_body_size 70m;

    # 不暴露内层 nginx 版本（公网边缘是 Caddy）。
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy — health endpoints plus the product paths from vite.config.ts.
    location ~ ^/(healthz|readyz|auth|me|datasets|jobs|documents|settings|chat|conversations|admin/observability/(metrics|traces)(/|$)) {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / long-poll support for /chat streaming.
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback — hash routing rarely triggers this, but it guards deep-link bookmarks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers. 边缘 Caddy 对 /api/* 直连路径设置同样的基础头，
    # 根路径经本容器代理，因此这里必须完整下发一次（避免与 Caddy 重复叠加）。
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # SPA 只用打包后的同源脚本与样式；Vue 的内联 style 属性需要 style-src 的 unsafe-inline。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
}
