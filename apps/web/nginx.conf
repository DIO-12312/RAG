server {
    listen 80;
    server_name _;

    # A 32 MiB source file gains multipart framing overhead in the browser.
    client_max_body_size 34m;

    root /usr/share/nginx/html;
    index index.html;

    # API proxy — mirrors the eight paths from vite.config.ts.
    location ~ ^/(auth|me|datasets|jobs|documents|settings|chat|conversations) {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / long-poll support for /chat streaming.
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback — hash routing rarely triggers this, but it guards deep-link bookmarks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
}
