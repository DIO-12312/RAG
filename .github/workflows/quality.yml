name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Check formatting
        run: uv run ruff format --check src tests scripts

      - name: Type check
        run: uv run mypy src scripts

      - name: Verify generated protobuf code
        run: uv run python scripts/check_generated.py

      - name: Run fast tests
        run: uv run pytest tests/unit tests/contract tests/functional

      - name: Run fake resilience tests
        run: uv run pytest -m resilience tests/resilience

      - name: Run deterministic retrieval evaluation
        run: uv run pytest -m eval tests/eval

      - name: Enforce core Python coverage
        run: >-
          uv run pytest
          --cov=rag_mvp.domain
          --cov=rag_mvp.application
          --cov=rag_mvp.ingestion
          --cov=rag_mvp.retrieval
          --cov-fail-under=85
          tests/unit tests/contract tests/functional tests/resilience tests/eval
