name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EARTHLY_FLAGS: --ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Earthly
        uses: earthly/actions-setup@v1
        with:
          version: "v0.8.16"

      - name: Run the Secret-free quality gate
        run: make ci
