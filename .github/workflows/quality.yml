name: Quality

"on":
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: release-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EARTHLY_DISABLE_ANALYTICS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check build prerequisites
        run: |
          make --version
          docker version

      - name: Install Earthly 0.8.16
        id: install
        run: |
          mkdir -p "$RUNNER_TEMP/earthly-bin"
          cd "$RUNNER_TEMP/earthly-bin"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 10 --max-time 180 \
            https://github.com/earthly/earthly/releases/download/v0.8.16/earthly-linux-amd64 \
            --output earthly
          echo '3ef3163c81bdd10e28ab31cd96e35c1856d97478c8ce7f20954b8bea7a598404  earthly' | sha256sum --check --strict
          chmod +x earthly
          ./earthly --version
          echo "$RUNNER_TEMP/earthly-bin" >> "$GITHUB_PATH"

      - name: Run offline quality gate
        id: gate
        env:
          EARTHLY_FLAGS: --ci
        run: make release-check

      - name: Explain failure
        if: ${{ failure() }}
        run: |
          echo '::error::Quality failed. Check the first failing step; reproduce the failing layer with make release-check, or Python-only failures with make ci. See docs/test/testing-guide.md section 7. Do not bypass failing checks.'
