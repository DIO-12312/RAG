global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:9464]
  - job_name: observability-retention
    static_configs:
      - targets: [observability-retention:9470]
  - job_name: tempo
    metrics_path: /metrics
    static_configs:
      - targets: [tempo:3200]
